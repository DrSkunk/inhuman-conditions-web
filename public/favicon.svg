<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="#0d0d0d"/>
  <!-- Robot head outline -->
  <rect x="8" y="10" width="16" height="12" rx="2" stroke="#b91c1c" stroke-width="1.5" fill="none"/>
  <!-- Eyes -->
  <rect x="10" y="13" width="4" height="3" rx="1" fill="#b91c1c"/>
  <rect x="18" y="13" width="4" height="3" rx="1" fill="#b91c1c"/>
  <!-- Antenna -->
  <line x1="16" y1="6" x2="16" y2="10" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="16" cy="5" r="1.5" fill="#b91c1c"/>
  <!-- Neck -->
  <rect x="14" y="22" width="4" height="2" rx="1" fill="#b91c1c"/>
</svg>